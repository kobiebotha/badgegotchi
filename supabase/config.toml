project_id = "badgegotchi"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
enable_signup = true
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/",
  "http://127.0.0.1:5173",
  "http://127.0.0.1:5173/",
]

[auth.email]
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.email.template.confirmation]
subject = "Your Badgegotchi sign-in code"
content_path = "./supabase/templates/sign-in-code.html"

[auth.email.template.magic_link]
subject = "Your Badgegotchi sign-in code"
content_path = "./supabase/templates/sign-in-code.html"

[functions.pet-ai]
enabled = true
verify_jwt = true
entrypoint = "./functions/pet-ai/index.ts"

[functions.badge-gateway]
enabled = true
# This gateway has public bootstrap/JWKS routes and validates every owner JWT
# through Auth itself. Badge credentials are opaque, not Supabase JWTs.
verify_jwt = false
entrypoint = "./functions/badge-gateway/index.ts"

[functions.pet-worker]
enabled = true
# Independent service-secret authentication in the worker entrypoint.
verify_jwt = false
entrypoint = "./functions/pet-worker/index.ts"
