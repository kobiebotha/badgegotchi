<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Badgegotchi sign-in code</title>
  </head>
  <body style="margin: 0; padding: 32px 16px; background: #f4f3e9; color: #343a2e; font-family: Arial, sans-serif;">
    <main style="max-width: 480px; margin: 0 auto; padding: 32px; background: #fffef7; border: 1px solid #dedfce; border-radius: 20px;">
      <p style="margin-top: 0; color: #66765c;">Badgegotchi</p>
      <h1 style="font-size: 26px; line-height: 1.25;">Your sign-in code</h1>
      <p style="line-height: 1.6;">Enter this code in Badgegotchi to sign in:</p>
      <p style="padding: 20px; background: #edf0e1; border-radius: 12px; font-family: monospace; font-size: 32px; letter-spacing: 4px; text-align: center;">{{ .Token }}</p>
      <p style="line-height: 1.6;">This code works once. If it expires, request a new code from the app.</p>
      <p style="margin-bottom: 0; font-size: 14px; line-height: 1.6; color: #66765c;">If you didn't request this email, you can ignore it.</p>
    </main>
  </body>
</html>
